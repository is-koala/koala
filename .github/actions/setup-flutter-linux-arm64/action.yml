name: Flutter Linux ARM64 kurulumu
description: Sabitlenmiş Flutter sürümünü kaynaktan kurup runner'a özel araç önbelleğinde tutar.

inputs:
  flutter-version:
    description: Kurulacak Flutter Git etiketi
    required: true

runs:
  using: composite
  steps:
    - name: Flutter SDK'yı hazırla
      shell: bash
      env:
        FLUTTER_VERSION: ${{ inputs.flutter-version }}
      run: |
        set -euo pipefail

        flutter_root="$RUNNER_TOOL_CACHE/flutter-source/$FLUTTER_VERSION-$RUNNER_ARCH"
        pub_cache="$RUNNER_TOOL_CACHE/pub-cache"

        if [[ ! -x "$flutter_root/bin/flutter" ]]; then
          install_root="$(mktemp -d "$RUNNER_TEMP/flutter-source.XXXXXX")"
          git clone --depth 1 --branch "$FLUTTER_VERSION" \
            https://github.com/flutter/flutter.git \
            "$install_root/flutter"
          mkdir -p "$(dirname "$flutter_root")"
          mv "$install_root/flutter" "$flutter_root"
          rmdir "$install_root"
        fi

        mkdir -p "$pub_cache"
        echo "FLUTTER_ROOT=$flutter_root" >> "$GITHUB_ENV"
        echo "PUB_CACHE=$pub_cache" >> "$GITHUB_ENV"
        echo "$flutter_root/bin" >> "$GITHUB_PATH"

        "$flutter_root/bin/flutter" config --no-analytics
        "$flutter_root/bin/flutter" --version
        "$flutter_root/bin/flutter" precache --linux

        # Flutter 3.47.1'in linux-arm64 artifact paketindeki frontend server
        # yanlışlıkla x64. Aynı engine revizyonuyla gelen ARM64 Dart SDK'daki
        # native kopyayı kullan; aksi hâlde gerçek Pi'de test süreci açılamaz.
        if [[ "$RUNNER_ARCH" == "ARM64" ]]; then
          cp \
            "$flutter_root/bin/cache/dart-sdk/bin/snapshots/frontend_server_aot.dart.snapshot" \
            "$flutter_root/bin/cache/artifacts/engine/linux-arm64/frontend_server_aot.dart.snapshot"
        fi
