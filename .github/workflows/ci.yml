name: CI

# PR kapısı GitHub'ın kendi ubuntu-latest runner'larında koşar. Eski
# self-hosted Pi runner'ı kaldırıldı.
# macOS dakikası 10 kat sayıldığı için iOS derlemesi PR'da koşmaz
# (ios.yml yalnız elle). Store/TestFlight mobile-release.yml'de mobile-v*
# etiketindedir.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_android:
        description: Android debug APK derlemesini de çalıştır
        required: false
        default: false
        type: boolean

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Bu zincirin hiçbir işi yazma yetkisi kullanmıyor; varsayılan geniş
# token'ı daraltıyoruz.
permissions:
  contents: read

env:
  # pubspec.lock: dart >=3.12.0, flutter >=3.44.0. Sürüm üç workflow'da aynı.
  FLUTTER_VERSION: 3.47.1
  JAVA_VERSION: 17

jobs:
  analyze:
    name: Format & Analiz
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Deponun konvansiyonu üçüncü taraf action'da tam SHA.
      # cache: true hem SDK'yı hem pub önbelleğini saklar.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Bağımlılıkları indir
        run: flutter pub get

      - name: Format kontrolü
        run: dart format --output=none --set-exit-if-changed lib test

      # Info seviyesi de kırmızı: kod tabanı bu eşiği geçecek şekilde
      # temizlendi, geriye düşmesin.
      - name: Statik analiz
        run: flutter analyze --fatal-infos --no-pub

  test:
    name: Testler
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Bağımlılıkları indir
        run: flutter pub get

      - name: Eksik ortamın sessiz API seçmediğini doğrula
        run: flutter test --no-pub test/product/network/api_config_test.dart --reporter expanded

      # Backend sözleşme testleri (test/support/backend_error_*_test.dart)
      # KOALA_BACKEND_ROOT ister. GITHUB_TOKEN başka bir private depoyu
      # okuyamaz (PR 144: Not Found); bu yüzden hosted runner'da bu testler
      # skip olur, suite durmaz.
      - name: Testleri çalıştır
        run: flutter test --flavor staging --dart-define-from-file=config/staging.json --no-pub --reporter expanded

  build-android:
    name: Android derleme
    needs: [analyze, test]
    # PR'da koşmaz; yalnız elle ve build_android seçilirse.
    if: github.event_name == 'workflow_dispatch' && inputs.build_android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Flutter önce kurulur: setup-android-x64-tools'un gen_snapshot yoklaması
      # FLUTTER_ROOT istiyor (flutter-action GITHUB_ENV'e yazar). Debug APK'da
      # o yoklama zaten kapalı.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # JDK + Android SDK + x64 araç yoklaması tek yerde. Hosted runner zaten
      # x86-64; yoklamalar burada emülasyonsuz, doğrudan geçer.
      - uses: ./.github/actions/setup-android-x64-tools
        with:
          java-version: ${{ env.JAVA_VERSION }}
          probe-gen-snapshot: "false"

      - name: Bağımlılıkları indir
        run: flutter pub get

      # Staging Maps anahtarı yoksa bu yalnız derleme kanıtıdır; harita kabulü değildir.
      - name: APK derle (debug)
        run: flutter build apk --debug --flavor staging --dart-define-from-file=config/staging.json

      - uses: actions/upload-artifact@v4
        with:
          name: koala-staging-debug-apk
          path: build/app/outputs/flutter-apk/app-staging-debug.apk
          retention-days: 7

  # iOS derlemesi .github/workflows/ios.yml'dedir (yalnız workflow_dispatch).
