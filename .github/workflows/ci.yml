name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Aynı PR'a arka arkaya push atılırsa önceki çalışmayı iptal et.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.1
  JAVA_VERSION: 17

jobs:
  analyze:
    name: Format & Analiz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Bağımlılıkları indir
        run: flutter pub get

      - name: Format kontrolü
        run: dart format --output=none --set-exit-if-changed lib test

      # Info seviyesi de kırmızı: kod tabanı bu eşiği geçecek şekilde
      # temizlendi, geriye düşmesin.
      - name: Statik analiz
        run: flutter analyze --fatal-infos

  test:
    name: Testler
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Bağımlılıkları indir
        run: flutter pub get

      - name: Eksik ortamın sessiz API seçmediğini doğrula
        run: flutter test test/product/network/api_config_test.dart --reporter expanded

      # Staging testleri de gerçek runtime ortam seçimini kullanır.
      - name: Testleri çalıştır
        run: flutter test --flavor staging --dart-define-from-file=config/staging.json --reporter expanded --coverage

      # PR'da bir testin neden düştüğü, hangi satırın kapsanmadığı
      # sorulduğunda ham lcov'a bakılabilsin.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: koala-coverage
          path: coverage/lcov.info
          retention-days: 7

  build-android:
    name: Android derleme
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Bağımlılıkları indir
        run: flutter pub get

      # Staging Maps anahtarı yoksa bu yalnız derleme kanıtıdır; harita kabulü değildir.
      - name: APK derle (debug)
        run: flutter build apk --debug --flavor staging --dart-define-from-file=config/staging.json

      # Test edecek arkadaşlar APK'yı doğrudan PR sayfasından indirebilsin.
      - uses: actions/upload-artifact@v4
        with:
          name: koala-staging-debug-apk
          path: build/app/outputs/flutter-apk/app-staging-debug.apk
          retention-days: 7

  build-ios:
    name: iOS derleme
    needs: test
    # macOS runner yavaş; PR'ları bekletmemek için sadece main'e push ve
    # elle tetiklemede çalışır.
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Bağımlılıkları indir
        run: flutter pub get

      # İmzalama sertifikası olmadığı için --no-codesign; amaç native tarafın
      # derlendiğini görmek.
      - name: iOS derle (imzasız)
        run: flutter build ios --no-codesign --flavor staging --dart-define-from-file=config/staging.json
