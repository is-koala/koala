name: CI

# macOS dakikası 10 kat sayıldığı için iOS derlemesi PR'da koşmaz (ios.yml
# elle). Store/TestFlight mobile-release.yml'de, mobile-v* etiketinde.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_android:
        description: Android debug APK derlemesini de çalıştır
        required: false
        default: false
        type: boolean

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Sürüm üç workflow'da aynı.
  FLUTTER_VERSION: 3.50.1
  JAVA_VERSION: 17

jobs:
  analyze:
    name: Format & Analiz
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Üçüncü taraf action'lar tam SHA'ya sabit.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Bağımlılıkları indir
        run: flutter pub get

      - name: Format kontrolü
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Statik analiz
        run: flutter analyze --fatal-infos --no-pub

  test:
    name: Testler
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Bağımlılıkları indir
        run: flutter pub get

      - name: Eksik ortamın sessiz API seçmediğini doğrula
        run: flutter test --no-pub test/product/network/api_config_test.dart --reporter expanded

      # Backend sözleşme testleri KOALA_BACKEND_ROOT ister; GITHUB_TOKEN backend
      # deposunu okuyamadığı için burada skip olur.
      - name: Testleri çalıştır
        run: flutter test --flavor staging --dart-define-from-file=config/staging.json --no-pub --reporter expanded

  build-android:
    name: Android derleme
    needs: [analyze, test]
    if: github.event_name == 'workflow_dispatch' && inputs.build_android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # setup-android-x64-tools'un gen_snapshot yoklaması FLUTTER_ROOT istiyor,
      # o yüzden Flutter önce kurulur.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: ./.github/actions/setup-android-x64-tools
        with:
          java-version: ${{ env.JAVA_VERSION }}
          probe-gen-snapshot: "false"

      - name: Bağımlılıkları indir
        run: flutter pub get

      # Staging Maps anahtarı yoksa bu yalnız derleme kanıtı.
      - name: APK derle (debug)
        run: flutter build apk --debug --flavor staging --dart-define-from-file=config/staging.json

      - uses: actions/upload-artifact@v4
        with:
          name: koala-staging-debug-apk
          path: build/app/outputs/flutter-apk/app-staging-debug.apk
          retention-days: 7
