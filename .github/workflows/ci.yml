name: CI

# PR ve main GitHub kuyruğunu doldurmaz. Kapı Yusuf'un Mac'indedir.
# Hetzner self-hosted işleri yalnız elle workflow_dispatch ile koşar.
# Store/TestFlight hâlâ mobile-release.yml içinde mobile-v* etiketindedir.
on:
  workflow_dispatch:
    inputs:
      build_android:
        description: Android debug APK derlemesini de çalıştır
        required: false
        default: false
        type: boolean

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# mobile-release.yml'de vardı, burada yoktu. Bu zincirin hiçbir işi yazma
# yetkisi kullanmıyor; varsayılan geniş token'ı daraltıyoruz.
permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.1
  JAVA_VERSION: 17

jobs:
  analyze:
    name: Format & Analiz
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      # Resmî Linux arşivinde ARM64 SDK yok; sabit etiketi kaynaktan kuran
      # yerel action, resmî ARM64 Dart ve test artifact'lerini indirir.
      - uses: ./.github/actions/setup-flutter-linux-arm64
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Bağımlılıkları indir
        run: flutter pub get

      - name: Format kontrolü
        run: dart format --output=none --set-exit-if-changed lib test

      # Info seviyesi de kırmızı: kod tabanı bu eşiği geçecek şekilde
      # temizlendi, geriye düşmesin.
      - name: Statik analiz
        run: flutter analyze --fatal-infos

  test:
    name: Testler
    needs: analyze
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-flutter-linux-arm64
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Bağımlılıkları indir
        run: flutter pub get

      - name: Eksik ortamın sessiz API seçmediğini doğrula
        run: flutter test test/product/network/api_config_test.dart --reporter expanded

      # GITHUB_TOKEN başka bir private depoyu okuyamaz (PR 144: Not Found).
      # Aynı Pi'deki koala-backend işinin checkout'u ya da geliştirici ağacı
      # varsa ona bağlanır; yoksa sözleşme testleri skip olur, suite durmaz.
      - name: Backend sözleşmesini bağla
        run: |
          set -euo pipefail
          java_rel='src/main/java/com/exskylab/koala/core/utilities/results/ErrorCategory.java'
          candidates=(
            "${GITHUB_WORKSPACE}/../koala-backend/koala-backend"
            "${RUNNER_TOOL_CACHE}/koala-backend"
            "${HOME}/Projects/koala/koala-backend"
          )
          for c in "${candidates[@]}"; do
            if [ -f "$c/$java_rel" ]; then
              echo "KOALA_BACKEND_ROOT=$(cd "$c" && pwd)" >> "$GITHUB_ENV"
              echo "backend contract root: $c"
              exit 0
            fi
          done
          echo "koala-backend not beside this runner; category/code contract tests skip"

      # Staging testleri de gerçek runtime ortam seçimini kullanır.
      - name: Testleri çalıştır
        # Tek Pi runner'ında Flutter'ın kendi test paralelliğini ve microSD
        # yazma yükünü sınırlı tut; coverage bu iş akışının kalite kapısı değil.
        run: flutter test --flavor staging --dart-define-from-file=config/staging.json --reporter expanded --concurrency=1

  build-android:
    name: Android derleme
    needs: test
    # Google'ın Linux Android host araçları x64. Pi'de otomatik çalıştırmak
    # yerine, QEMU/konteyner aracı hazır olduğunda elle ve bilinçli olarak dene.
    if: github.event_name == 'workflow_dispatch' && inputs.build_android
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      # Flutter önce kurulur: setup-android-x64-tools'un gen_snapshot yoklaması
      # FLUTTER_ROOT istiyor. Burada debug APK derlendiği için o yoklama zaten
      # kapalı, ama iki workflow'un adım sırası aynı kalsın.
      - uses: ./.github/actions/setup-flutter-linux-arm64
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      # JDK + Android SDK + x64 emülasyon nöbetçisi tek yerde. Aynı 19 satır
      # eskiden mobile-release.yml'e birebir kopyalanmıştı.
      - uses: ./.github/actions/setup-android-x64-tools
        with:
          java-version: ${{ env.JAVA_VERSION }}
          # Debug APK JIT'tir; Android AOT gen_snapshot'ını çalıştırmaz.
          probe-gen-snapshot: "false"

      - name: Bağımlılıkları indir
        run: flutter pub get

      # Staging Maps anahtarı yoksa bu yalnız derleme kanıtıdır; harita kabulü değildir.
      - name: APK derle (debug)
        run: flutter build apk --debug --flavor staging --dart-define-from-file=config/staging.json

      # Test edecek arkadaşlar APK'yı doğrudan PR sayfasından indirebilsin.
      - uses: actions/upload-artifact@v4
        with:
          name: koala-staging-debug-apk
          path: build/app/outputs/flutter-apk/app-staging-debug.apk
          retention-days: 7

  # iOS derlemesi buradan .github/workflows/ios.yml dosyasına taşındı.
  # Gerekçe: `paths:` filtresi yalnız workflow seviyesinde çalışıyor, iş
  # seviyesinde yok. Ayrıntı için o dosyanın başındaki nota bak.
