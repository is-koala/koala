name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_android:
        description: Android debug APK derlemesini de çalıştır
        required: false
        default: false
        type: boolean
      build_ios:
        description: iOS imzasız derlemesini de çalıştır
        required: false
        default: false
        type: boolean

# Aynı PR'a arka arkaya push atılırsa önceki çalışmayı iptal et.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.1
  JAVA_VERSION: 17

jobs:
  analyze:
    name: Format & Analiz
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      # Resmî Linux arşivinde ARM64 SDK yok; sabit etiketi kaynaktan kuran
      # yerel action, resmî ARM64 Dart ve test artifact'lerini indirir.
      - uses: ./.github/actions/setup-flutter-linux-arm64
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Bağımlılıkları indir
        run: flutter pub get

      - name: Format kontrolü
        run: dart format --output=none --set-exit-if-changed lib test

      # Info seviyesi de kırmızı: kod tabanı bu eşiği geçecek şekilde
      # temizlendi, geriye düşmesin.
      - name: Statik analiz
        run: flutter analyze --fatal-infos

  test:
    name: Testler
    needs: analyze
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-flutter-linux-arm64
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Bağımlılıkları indir
        run: flutter pub get

      - name: Eksik ortamın sessiz API seçmediğini doğrula
        run: flutter test test/product/network/api_config_test.dart --reporter expanded

      # Staging testleri de gerçek runtime ortam seçimini kullanır.
      - name: Testleri çalıştır
        # Tek Pi runner'ında Flutter'ın kendi test paralelliğini ve microSD
        # yazma yükünü sınırlı tut; coverage bu iş akışının kalite kapısı değil.
        run: flutter test --flavor staging --dart-define-from-file=config/staging.json --reporter expanded --concurrency=1

  build-android:
    name: Android derleme
    needs: test
    # Google'ın Linux Android host araçları x64. Pi'de otomatik çalıştırmak
    # yerine, QEMU/konteyner aracı hazır olduğunda elle ve bilinçli olarak dene.
    if: github.event_name == 'workflow_dispatch' && inputs.build_android
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Android SDK önbelleğini ayarla
        run: |
          echo "ANDROID_HOME=$RUNNER_TOOL_CACHE/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$RUNNER_TOOL_CACHE/android-sdk" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - uses: ./.github/actions/setup-flutter-linux-arm64
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          packages: platform-tools platforms;android-37 build-tools;37.0.0
          log-accepted-android-sdk-licenses: false

      - name: x64 Android araç emülasyonunu doğrula
        shell: bash
        run: |
          set -euo pipefail
          if ! "$ANDROID_SDK_ROOT/build-tools/37.0.0/aapt2" version; then
            echo "::error::Google'ın x64 Android aracı bu ARM64 runner'da çalışmadı. APK'yı x64 bir runner'da ya da doğrulanmış amd64 konteynerde derle."
            exit 1
          fi

      - name: Bağımlılıkları indir
        run: flutter pub get

      # Staging Maps anahtarı yoksa bu yalnız derleme kanıtıdır; harita kabulü değildir.
      - name: APK derle (debug)
        run: flutter build apk --debug --flavor staging --dart-define-from-file=config/staging.json

      # Test edecek arkadaşlar APK'yı doğrudan PR sayfasından indirebilsin.
      - uses: actions/upload-artifact@v4
        with:
          name: koala-staging-debug-apk
          path: build/app/outputs/flutter-apk/app-staging-debug.apk
          retention-days: 7

  build-ios:
    name: iOS derleme
    needs: test
    # iOS yalnız macOS'ta derlenebilir; normal Pi CI koşusundan ayrı tutulur.
    if: github.event_name == 'workflow_dispatch' && inputs.build_ios
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Bağımlılıkları indir
        run: flutter pub get

      # İmzalama sertifikası olmadığı için --no-codesign; amaç native tarafın
      # derlendiğini görmek.
      - name: iOS derle (imzasız)
        run: flutter build ios --no-codesign --flavor staging --dart-define-from-file=config/staging.json
