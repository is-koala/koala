name: iOS derleme

# macOS dakikası 10 kat sayıldığı için yalnız elle. İmzalı IPA
# mobile-release.yml'de.
on:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.50.1

jobs:
  build-ios:
    name: iOS derleme
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Bağımlılıkları indir
        run: flutter pub get

      - name: iOS derle (imzasız)
        run: flutter build ios --no-codesign --flavor staging --dart-define-from-file=config/staging.json
