name: iOS derleme

# PR ve main macos-latest dakikası yakmaz. Kapı Yusuf'un Mac'indedir
# (`flutter build ios --no-codesign`). Bu iş yalnız elle workflow_dispatch.
# Store/TestFlight imzalı IPA hâlâ mobile-release.yml içinde mobile-v*
# etiketindedir; aynı etikete ikinci, imzasız bir derleme eklenmez.
on:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.1

jobs:
  build-ios:
    name: iOS derleme
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Deponun konvansiyonu tam SHA. ci.yml'deki eski hâli hareketli `@v2`
      # etiketine bağlıydı; mobile-release.yml'in kullandığı SHA'ya sabitlendi.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Bağımlılıkları indir
        run: flutter pub get

      # İmzalama sertifikası olmadığı için --no-codesign; amaç native tarafın
      # derlendiğini görmek.
      - name: iOS derle (imzasız)
        run: flutter build ios --no-codesign --flavor staging --dart-define-from-file=config/staging.json
