name: Mobil İç Test Yayını

on:
  push:
    tags:
      - "mobile-v*"

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.1
  JAVA_VERSION: 17

jobs:
  validate:
    name: Sözleşme ve testler
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-flutter-linux-arm64
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Bağımlılıkları indir
        run: flutter pub get

      - name: Etiket ile sürümü eşleştir
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          dart run tool/validate_release_tag.dart "$GITHUB_REF_NAME"

      - name: Statik analiz ve testler
        run: |
          dart format --output=none --set-exit-if-changed lib test tool
          flutter analyze --fatal-infos
          flutter test --flavor staging --dart-define-from-file=config/staging.json --concurrency=1

  android-internal:
    name: Play internal
    needs: validate
    runs-on: self-hosted
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Android SDK önbelleğini ayarla
        run: |
          echo "ANDROID_HOME=$RUNNER_TOOL_CACHE/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$RUNNER_TOOL_CACHE/android-sdk" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - uses: ./.github/actions/setup-flutter-linux-arm64
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          packages: platform-tools platforms;android-37 build-tools;37.0.0
          log-accepted-android-sdk-licenses: false

      - name: x64 Android araç emülasyonunu doğrula
        shell: bash
        run: |
          set -euo pipefail
          if ! "$ANDROID_SDK_ROOT/build-tools/37.0.0/aapt2" version; then
            echo "::error::Google'ın x64 Android aracı bu ARM64 runner'da çalışmadı. AAB'yi x64 bir runner'da ya da doğrulanmış amd64 konteynerde derle."
            exit 1
          fi

      - name: İmzalama sırlarını doğrula
        shell: bash
        env:
          KOALA_ANDROID_KEYSTORE_BASE64: ${{ secrets.KOALA_ANDROID_KEYSTORE_BASE64 }}
          KOALA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KOALA_ANDROID_KEYSTORE_PASSWORD }}
          KOALA_ANDROID_KEY_ALIAS: ${{ secrets.KOALA_ANDROID_KEY_ALIAS }}
          KOALA_ANDROID_KEY_PASSWORD: ${{ secrets.KOALA_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KOALA_ANDROID_KEYSTORE_BASE64"
          test -n "$KOALA_ANDROID_KEYSTORE_PASSWORD"
          test -n "$KOALA_ANDROID_KEY_ALIAS"
          test -n "$KOALA_ANDROID_KEY_PASSWORD"
          printf '%s' "$KOALA_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/koala-upload.jks"
          echo "KOALA_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/koala-upload.jks" >> "$GITHUB_ENV"

      - name: Production AAB derle
        env:
          KOALA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KOALA_ANDROID_KEYSTORE_PASSWORD }}
          KOALA_ANDROID_KEY_ALIAS: ${{ secrets.KOALA_ANDROID_KEY_ALIAS }}
          KOALA_ANDROID_KEY_PASSWORD: ${{ secrets.KOALA_ANDROID_KEY_PASSWORD }}
          KOALA_ANDROID_MAPS_API_KEY_PRODUCTION: ${{ secrets.KOALA_ANDROID_MAPS_API_KEY_PRODUCTION }}
        run: |
          test -n "$KOALA_ANDROID_MAPS_API_KEY_PRODUCTION"
          flutter pub get
          flutter build appbundle --release --flavor production \
            --dart-define-from-file=config/production.json \
            --build-name "${GITHUB_REF_NAME#mobile-v}" \
            --build-number ${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: koala-production-aab
          path: build/app/outputs/bundle/productionRelease/app-production-release.aab
          retention-days: 30

      - name: Play internal kanalına yükle
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.iskoala.koala
          releaseFiles: build/app/outputs/bundle/productionRelease/app-production-release.aab
          track: internal
          status: completed

  ios-testflight:
    name: TestFlight
    needs: validate
    runs-on: macos-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Apple imzalama materyalini geçici anahtarlığa kur
        shell: bash
        env:
          APPLE_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
          KOALA_IOS_MAPS_API_KEY_PRODUCTION: ${{ secrets.KOALA_IOS_MAPS_API_KEY_PRODUCTION }}
        run: |
          set -euo pipefail
          test -n "$APPLE_DISTRIBUTION_CERTIFICATE_BASE64"
          test -n "$APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD"
          test -n "$APPLE_PROVISIONING_PROFILE_BASE64"
          test -n "$APPLE_TEAM_ID"
          test -n "$APP_STORE_CONNECT_API_KEY_ID"
          test -n "$APP_STORE_CONNECT_API_ISSUER_ID"
          test -n "$APP_STORE_CONNECT_API_KEY_P8_BASE64"
          test -n "$KOALA_IOS_MAPS_API_KEY_PRODUCTION"
          KEYCHAIN_PATH="$RUNNER_TEMP/koala-release.keychain-db"
          KEYCHAIN_PASSWORD="koala-ci-$GITHUB_RUN_ID"
          printf '%s' "$APPLE_DISTRIBUTION_CERTIFICATE_BASE64" | base64 -D > "$RUNNER_TEMP/distribution.p12"
          printf '%s' "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 -D > "$RUNNER_TEMP/production.mobileprovision"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/distribution.p12" -P "$APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/production.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/koala-production.mobileprovision"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_P8_BASE64" | base64 -D > "$HOME/.appstoreconnect/private_keys/AuthKey_$APP_STORE_CONNECT_API_KEY_ID.p8"
          printf 'MAPS_API_KEY = %s\nDEVELOPMENT_TEAM = %s\n' "$KOALA_IOS_MAPS_API_KEY_PRODUCTION" "$APPLE_TEAM_ID" > ios/Flutter/Secrets.production.xcconfig
          echo "KOALA_RELEASE_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Production IPA derle
        run: |
          flutter pub get
          flutter build ipa --release --flavor production \
            --dart-define-from-file=config/production.json \
            --build-name "${GITHUB_REF_NAME#mobile-v}" \
            --build-number ${{ github.run_number }} \
            --export-method app-store

      - uses: actions/upload-artifact@v4
        with:
          name: koala-production-ipa
          path: build/ios/ipa/*.ipa
          retention-days: 30

      - name: TestFlight'a yükle
        shell: bash
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA_PATH="$(find build/ios/ipa -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$IPA_PATH"
          xcrun altool --upload-app --file "$IPA_PATH" --type ios \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID"

      - name: Geçici imzalama materyalini temizle
        if: always()
        shell: bash
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          security delete-keychain "$KOALA_RELEASE_KEYCHAIN" 2>/dev/null || true
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/koala-production.mobileprovision"
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_$APP_STORE_CONNECT_API_KEY_ID.p8"
