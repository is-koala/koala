org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# ⚠️ GERİ ALINDI — sebebi ve geri açma koşulu aşağıda.
#
# AGP 9 varsayılan olarak built-in Kotlin kullanıyor ve `builtInKotlin=true`
# iken `org.jetbrains.kotlin.android` eklentisini uygulayan **her** modül
# build'i düşürüyor. `flutter_nfc_kit` (kimlik kartı çipini okuyan taşıma,
# `dmrtd`'nin de bağımlılığı) 3.6.2 dahil **hiçbir** sürümünde bu eklentiyi
# bırakmış değil; upstream'in master, develop ve açık PR'larında da düzeltme
# yok (6 Eylül 2026'da bakıldı). Yani bayrak açık kaldığı sürece Android
# build'i alınamıyor.
#
# Bedeli: app modülü `kotlin-android` eklentisini yeniden uyguluyor
# (`app/build.gradle.kts`). jvmTarget hâlâ üst düzey `kotlin { }` bloğunda —
# o DSL KGP ile de geçerli, taşımaya gerek yok.
#
# GERİ AÇ: `flutter_nfc_kit` built-in Kotlin'e geçtiği gün bu satır `true`
# yapılıp `app/build.gradle.kts`'teki eklenti satırı yeniden silinmeli.
# google_mlkit_* paketleri zaten geçmiş durumda; tek engel bu.
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# mobile_scanner (biniş QR'ı, is-koala/koala#217) ML Kit barkod modelini
# varsayılan olarak APK'ya gömüyor. `true` ile Play Services varyantı
# (`play-services-mlkit-barcode-scanning`) kullanılıyor; Latin OCR ile aynı
# karar: model cihazda Google Play Hizmetleri'nden iner, Play Services'ı
# olmayan cihazda (Huawei vb.) tarama çalışmaz ve ekran bunu söyler.
# `app/build.gradle.kts` → `verifyUnbundledMlKitModels` gömülü modülün
# production grafiğine geri dönmediğini denetliyor.
dev.steenbakker.mobile_scanner.useUnbundled=true
