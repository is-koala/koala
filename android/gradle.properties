org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Built-in Kotlin açık (Flutter 3.50, 2026-11-22). Daha önce kapalıydı çünkü
# `flutter_nfc_kit` ve `firebase_core` Kotlin Gradle Plugin'i (KGP) kendileri
# uyguluyordu ve bayrak açıkken build düşüyordu. flutter_nfc_kit 3.7.0,
# firebase_core 5.2.0 ve firebase_messaging 17.1.0 built-in Kotlin'e geçti;
# app modülü de `kotlin-android` uygulamıyor. KGP uygulayan bir eklenti
# eklenirse build düşer: önce eklentinin built-in Kotlin desteğine bak.
android.builtInKotlin=true
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# mobile_scanner (biniş QR'ı, is-koala/koala#217) ML Kit barkod modelini
# varsayılan olarak APK'ya gömüyor. `true` ile Play Services varyantı
# (`play-services-mlkit-barcode-scanning`) kullanılıyor; Latin OCR ile aynı
# karar: model cihazda Google Play Hizmetleri'nden iner, Play Services'ı
# olmayan cihazda (Huawei vb.) tarama çalışmaz ve ekran bunu söyler.
# `app/build.gradle.kts` → `verifyUnbundledMlKitModels` gömülü modülün
# production grafiğine geri dönmediğini denetliyor.
dev.steenbakker.mobile_scanner.useUnbundled=true
