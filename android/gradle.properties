org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Built-in Kotlin: KGP'yi kendisi uygulayan bir eklenti eklenirse build düşer;
# önce eklentinin built-in Kotlin desteğine bak.
android.builtInKotlin=true
android.newDsl=false
# Biniş QR'ı (#217): barkod modeli Play Services'tan iniyor, APK'ya gömülmüyor.
# Play Services'ı olmayan cihazda tarama çalışmaz ve ekran bunu söyler.
# `verifyUnbundledMlKitModels` gömülü modülün geri dönmediğini denetliyor.
dev.steenbakker.mobile_scanner.useUnbundled=true
