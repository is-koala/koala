name: koala
description: "A new Flutter project."

publish_to: "none"

version: 1.1.1+3

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # Storage
  shared_preferences: ^2.5.5
  sqflite: ^2.4.3

  # Bağlantı durumu yalnızca kalıcı mesai kuyruğunu yeniden denemeyi tetikler.
  connectivity_plus: ^7.3.1

  # UI
  smooth_page_indicator: ^3.0.0
  cupertino_icons: ^1.0.9
  reicon_flutter: ^1.0.1
  lottie: ^3.5.1
  flutter_svg: ^2.3.0

  # Maps
  google_maps_flutter: ^2.18.0

  # Routing
  go_router: ^18.0.0
  app_links: ^7.2.1

  # Permissions
  permission_handler: ^13.0.1
  geolocator: ^14.0.3

  # Media & dış bağlantı
  # image_picker: şirket logosu galeriden seçiliyor.
  # url_launcher: adayın özgeçmişi imzalı bir adrese yönlendiriliyor, tarayıcıda
  # açılıyor; işçinin iş detayındaki toplu taşıma yol tarifi de harici haritaya
  # derin bağlantıyla gidiyor (#188).
  # camera: TCKK MRZ'si uygulama içindeki canlı önizlemede, ham kareyi
  # diske yazmadan ve yalnız kadraj alanını kullanarak okunuyor.
  image_picker: ^1.2.0
  camera: ^0.12.1
  url_launcher: ^6.3.2

  # Kimlik kartı çipi (NFC) ve MRZ okuma
  #
  # dmrtd: ICAO Doc 9303'ü Dart'ta uygulayan tek ciddi açık kaynak kütüphane.
  # pub.dev'de **yok** (https://pub.dev/packages/dmrtd 404 dönüyor), yalnızca
  # GitHub'da yaşıyor. `ref:` ile commit sabitlendi — dal takip edilmiyor,
  # çünkü çip protokolü sessizce değişirse doğrulama akışı üretimde kırılır.
  #
  # ⚠️ LİSANS SORUSU AÇIK: dmrtd LGPL-3.0 ya da ticari lisansla dağıtılıyor.
  # Kapalı kaynak bir uygulamaya statik olarak girdiğinde yeniden bağlama
  # yükümlülüğü doğurabilir. Soru hukuk tarafında ve **mağazaya çıkmadan önce
  # cevaplanmalı**; kod yazmayı bloke etmiyor ama yayını bloke ediyor.
  dmrtd:
    git:
      url: https://github.com/ZeroPass/dmrtd.git
      ref: 3b6c091843573b275ae68a87335e1872f8b60ea0

  # dmrtd'nin ham APDU taşıması. Zaten dmrtd'nin bağımlılığı; burada açıkça
  # yazılı çünkü NFC'nin var / kapalı / desteklenmiyor ayrımını doğrudan bu
  # paketin `nfcAvailability` alanından okuyoruz.
  flutter_nfc_kit: ^3.6.2

  # MRZ okuması için **genel OCR**. MRZ ayrıştırıcı değil: TD1 düzeni ve ICAO
  # kontrol hanesi doğrulaması `settings/models/mrz_key.dart` içinde bizim.
  google_mlkit_text_recognition: ^0.17.1

  # State Management
  provider: ^6.1.5

  # Network
  dio: ^5.11.0
  flutter_secure_storage: ^11.0.0
  stomp_dart_client: ^3.0.1
  file_picker: ^12.2.0

  # Push. flutter/packages dışı; Yusuf 2026-09-12 onayladı (#141).
  # Sürüm FlutterFire 3.47 hattına sabit. flutter_local_notifications yok:
  # ön planda yerel bildirim çizilmez, arka planı FCM sistem tepsisi taşır.
  firebase_core: 4.14.0
  firebase_messaging: 16.6.0

# dmrtd `archive: ^3.6.1` istiyor, lottie 3.5.1 ise `archive: ^4.0.0`; ikisi
# aynı anda çözülemiyor ve pub'ın önerdiği çıkış yolu lottie'yi 3.3.0'a
# düşürmek — yani zaten yayında olan bir paketi geriye almak.
#
# Bunun yerine `archive` 3.6.1'e sabitlendi. Gerekçe:
# - lottie'nin `archive`'dan kullandığı **her şey** (`ZipDecoder.decodeBytes`,
#   `GZipDecoder.decodeBytes`, `ArchiveFile.name/.content`) 3.6.1'de aynı
#   imzayla var; `composition.dart` dışında `archive`'a hiç dokunmuyor.
# - O iki yol da sihirli baytla korumalı (`PK`, `1f 8b`) ve uygulamanın tek
#   Lottie varlığı düz JSON (`assets/lottie/email_verification_pending.json`),
#   yani zip/gzip kodu çalışma zamanında hiç çalışmıyor.
#
# ⚠️ Bu bir override: lottie kendi tabanının altında çalışıyor. `archive` 4
# isteyen **yeni** bir paket eklenirse bu satır onu sessizce eski sürüme
# çeker — o gün burayı okuyun. dmrtd `archive` 4'e geçtiğinde ya da dmrtd
# ticari bir SDK ile değiştiğinde bu blok tümüyle silinmeli.
dependency_overrides:
  archive: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.2+1
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/lottie/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins/Poppins-Black.ttf
          weight: 900
        - asset: assets/fonts/Poppins/Poppins-Bold.ttf
          weight: 800
        - asset: assets/fonts/Poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins/Poppins-SemiBold.ttf
          weight: 600
