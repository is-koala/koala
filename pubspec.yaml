name: koala
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # Storage
  shared_preferences: ^2.5.5

  # UI
  smooth_page_indicator: ^3.0.0
  cupertino_icons: ^1.0.9
  hugeicons: ^1.1.7
  lottie: ^3.5.1
  flutter_svg: ^2.3.0

  # Maps
  google_maps_flutter: ^2.18.0

  # Routing
  go_router: ^18.0.0
  app_links: ^7.2.1

  # Permissions
  permission_handler: ^13.0.1
  geolocator: ^14.0.3

  # State Management
  provider: ^6.1.5

  # Network
  dio: ^5.11.0
  flutter_secure_storage: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/lottie/
    - assets/map_pins/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins/Poppins-Black.ttf
          weight: 900
        - asset: assets/fonts/Poppins/Poppins-Bold.ttf
          weight: 800
        - asset: assets/fonts/Poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins/Poppins-SemiBold.ttf
          weight: 600
