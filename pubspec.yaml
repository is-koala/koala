name: koala
description: "A new Flutter project."

publish_to: "none"

version: 1.1.1+3

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  shared_preferences: ^2.5.5
  sqflite: ^2.4.3

  # Kalıcı mesai kuyruğunu bağlantı gelince yeniden denemek için.
  connectivity_plus: ^7.3.1

  # Flutter 3.50'den beri Material/Cupertino SDK dışında; çeviriler de
  # `material_ui`'dan (`GlobalMaterialLocalizations.delegates`).
  material_ui: ^1.11.1
  cupertino_ui: ^1.1.7
  smooth_page_indicator: ^3.0.0
  cupertino_icons: ^2.0.0
  reicon_flutter: ^1.0.1
  lottie: ^3.5.1
  flutter_svg: ^2.3.0

  google_maps_flutter: ^2.18.0

  go_router: ^18.0.0
  app_links: ^7.2.1

  permission_handler: ^13.0.1
  geolocator: ^14.0.3

  image_picker: ^1.2.0
  camera: ^0.12.1
  url_launcher: ^6.3.2

  # dmrtd: ICAO 9303'ün tek ciddi Dart uygulaması; pub.dev'de yok. Çip protokolü
  # sessizce değişmesin diye commit sabit.
  #
  # ⚠️ Lisans açık: LGPL-3.0 kapalı kaynakta yeniden bağlama yükümlülüğü
  # doğurabilir. Mağazaya çıkmadan önce hukuk cevaplamalı.
  dmrtd:
    git:
      url: https://github.com/ZeroPass/dmrtd.git
      ref: 3b6c091843573b275ae68a87335e1872f8b60ea0

  # dmrtd'nin bağımlılığı; NFC var/kapalı/yok ayrımını `nfcAvailability`'den
  # okuduğumuz için doğrudan yazılı.
  flutter_nfc_kit: ^3.7.0

  # Yalnız OCR; MRZ ayrıştırma ve kontrol hanesi `mrz_key.dart`'ta.
  google_mlkit_text_recognition: ^1.0.3

  # Biniş QR'ı (#217). Android barkod modeli Play Services'tan geliyor
  # (`gradle.properties` → `useUnbundled`).
  mobile_scanner: ^7.5.0
  qr_flutter: ^4.1.0

  provider: ^6.1.5

  dio: ^5.11.0
  flutter_secure_storage: ^11.0.0
  stomp_dart_client: ^3.0.1
  file_picker: ^13.4.1

  # FlutterFire sürümleri sabit. Ön planda yerel bildirim çizilmiyor, o yüzden
  # flutter_local_notifications yok.
  firebase_core: 5.2.0
  firebase_messaging: 17.1.0
  share_plus: ^13.3.1

# dmrtd `archive` 3, lottie 3.5 `archive` 4 istiyor. lottie'nin kullandığı
# zip/gzip API'leri 3.6.1'de aynı ve tek Lottie varlığımız düz JSON, yani o kod
# hiç çalışmıyor.
#
# ⚠️ `archive` 4 isteyen yeni bir paket bu override yüzünden sessizce eski
# sürüme düşer. dmrtd `archive` 4'e geçince bu blok silinmeli.
dependency_overrides:
  archive: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.2+1
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/lottie/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins/Poppins-Black.ttf
          weight: 900
        - asset: assets/fonts/Poppins/Poppins-Bold.ttf
          weight: 800
        - asset: assets/fonts/Poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins/Poppins-SemiBold.ttf
          weight: 600
